<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rei do Ouro – Simulador de Investimentos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya+Sans:wght@400;700&display=swap">
<style>
:root{--bg:#0d0d0d;--card:#1a1a1a;--ink:#ffffff;--mut:#d0ccc4;--line:#3a352e;--gold:#e0b83c;--acc:#c2410c;--accx:#fff;--bad:#ff6b5a;--good:#4ade80;--warn:#2b2312;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 "Alegreya Sans",system-ui,sans-serif}
#app{max-width:760px;margin:0 auto;padding:14px}
h1,h2,h3,.num{font-family:Cinzel,Georgia,serif}
h1{font-size:22px;margin:4px 0 10px;color:var(--gold)}
h2{font-size:18px;margin:18px 0 8px}
.top{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.top div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.top small{display:block;color:var(--mut)}
.top b{font:800 22px Cinzel,Georgia,serif}
.neg{color:var(--bad)}.pos{color:var(--good)}
.banner{margin:10px 0;padding:8px 12px;border-radius:10px;background:var(--warn);border:1px solid var(--line)}
.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.tabs button{flex:1;min-width:90px;padding:9px 6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:700 15px inherit;cursor:pointer}
.tabs button.on{background:var(--acc);color:var(--accx);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.num{display:inline-block;min-width:28px;text-align:center;background:var(--acc);color:var(--accx);border-radius:6px;padding:0 6px;margin-right:6px}
.tag{font-size:14px;color:var(--mut)}
.stats{display:flex;gap:14px;margin-top:4px;font-weight:700}
input{width:110px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
button.go{padding:9px 14px;border:0;border-radius:8px;background:var(--acc);color:var(--accx);font:700 16px inherit;cursor:pointer}
button.alt{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.form{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.turn{width:100%;margin-top:14px;padding:13px;font-size:18px}
ul.log{padding-left:18px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:10px 0}
.tile{text-align:center;margin:0;display:flex;flex-direction:column;gap:6px;align-items:center}
.tile .big{font-size:40px;line-height:1}
.tile.mine{border:2px solid var(--gold)}
.tile.lock{opacity:.55}
.map{width:100%;height:auto;display:block;margin:10px 0 4px}
.map .grass{fill:var(--card);stroke:var(--line)}
.map .road{stroke:var(--line);stroke-width:8;stroke-linecap:round}
.map .plaza{fill:var(--bg);stroke:var(--gold);stroke-width:2}
.map .lbl{fill:var(--ink);font:700 13px "Alegreya Sans",system-ui,sans-serif}
.map .bopen rect{fill:var(--bg);stroke:var(--acc);stroke-width:2}
.map .bmine rect{fill:var(--bg);stroke:var(--gold);stroke-width:4}
.map .block{opacity:.45}
.map .block rect{fill:var(--line);stroke:var(--mut);stroke-dasharray:5 4}

.magia{position:relative;width:100%;aspect-ratio:1312/1199;background-size:100% 100%;border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
.magia .hot{position:absolute;top:48.5%;height:33%;width:20.5%;border:2px solid transparent;border-radius:12px;background:transparent;cursor:pointer;padding:0;transition:background .15s,border-color .15s}
.magia .hot:hover{background:rgba(224,184,60,.12)}
.magia .hot.sel{border-color:var(--gold);background:rgba(224,184,60,.16);box-shadow:0 0 18px rgba(224,184,60,.45)}
.magia .hot.off{background:rgba(0,0,0,.55)}
.magia .hot.off.sel{background:rgba(0,0,0,.4)}
.magia .h1{left:17.8%}.magia .h2{left:40%}.magia .h3{left:62.8%}
.magia .bd{position:absolute;top:2%;left:50%;transform:translateX(-50%);background:rgba(13,13,13,.85);border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:1px 9px;font:700 clamp(11px,2.5vw,16px) Cinzel,Georgia,serif;white-space:nowrap}

.cli .cl-foto{position:relative;width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;border:3px solid var(--gold);background:var(--bg)}
.cli .cl-foto img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.cli .cl-foto .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font:800 90px Cinzel,Georgia,serif;color:var(--gold)}
.cli .cl-leg{margin-top:10px}
.cli .cl-nome{font:800 22px Cinzel,Georgia,serif;color:var(--gold);display:block}
.cli .cl-fala{font-style:italic;font-size:18px;margin-top:2px}
.cli .cl-mini{font-size:17px;font-weight:700;margin-top:10px}
.cli .cl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.cli .cl-grid div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.cli .cl-grid small{display:block;color:var(--mut);font-size:13px}

.cmap{position:relative;width:100%;aspect-ratio:1312/1199;background-size:100% 100%;border:1px solid var(--line);border-radius:12px;margin:10px 0 6px;overflow:hidden}
.cmap .ctit{position:absolute;left:2%;top:2.3%;width:25%;height:7%;display:flex;align-items:center;justify-content:center;text-align:center;font:800 clamp(8px,2.2vw,15px) Cinzel,Georgia,serif;color:#4a2f12;line-height:1.1}
.cmap .ch{position:absolute;background:transparent;border:2px solid transparent;border-radius:14px;cursor:pointer;padding:0;transition:background .15s,border-color .15s,box-shadow .15s}
.cmap .ch:hover{background:rgba(255,255,255,.12)}
.cmap .ch.sel{border-color:var(--gold);background:rgba(224,184,60,.2);box-shadow:0 0 18px rgba(224,184,60,.7)}
.cmap .ch.mine{border-color:var(--gold);background:rgba(224,184,60,.18);box-shadow:0 0 22px rgba(224,184,60,.85)}
.cmap .ch.lock{background:rgba(0,0,0,.55);cursor:not-allowed}
.cmap .cp{position:absolute;left:50%;bottom:-2%;transform:translate(-50%,50%);background:rgba(13,13,13,.88);border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:1px 8px;font:700 clamp(9px,2.3vw,14px) Cinzel,Georgia,serif;white-space:nowrap}
.cmap .ch.lock .cp{color:var(--mut);border-color:var(--line)}
.pick .pk-head{display:flex;gap:12px;align-items:center}
.pick .pk-ico{font-size:44px;line-height:1}
.pick .pk-nome{font:800 20px Cinzel,Georgia,serif;color:var(--gold)}
.pick .cl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.pick .cl-grid div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.pick .cl-grid small{display:block;color:var(--mut);font-size:13px}
.pick .pk-btn{width:100%;font-size:18px;padding:13px}
.pick .pk-warn{margin-top:10px;padding:8px 12px;border-radius:10px;background:var(--warn);border:1px solid var(--gold);font-weight:700}
.pick.empty{text-align:center}
.pick.mineCard{border:2px solid var(--gold)}
button:disabled{opacity:.5;cursor:not-allowed}
.menu{text-align:center;padding-top:5vh}
.menu h1{font-size:40px;margin:0 0 4px}
.menu>.go,.menu>.alt{display:block;width:100%;max-width:320px;margin:12px auto;font-size:19px;padding:13px}
.menu h2{margin-top:22px}
.menu .card{text-align:left;align-items:center}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
summary{font-weight:700;cursor:pointer}
.over{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.over div{background:var(--card);padding:24px;border-radius:14px;max-width:420px;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
// [nome, descrição, risco%, lucro%, duração em turnos, raro]
const C=[
["Poupança do Reino","Cofre seguro da coroa.",2,5,1],
["Feira de Aldeia","Revender queijos e pão.",8,15,1],
["Caravana de Especiarias","Rota perigosa até o oriente.",25,45,2],
["Ferreiro Aprendiz","Financiar uma forja nova.",15,30,2],
["Taverna do Porto","Sociedade numa taverna movimentada.",18,35,2],
["Navio Mercante","Carga de seda pelos mares.",30,60,3],
["Vinhedo Real","O vinho envelhece e valoriza.",10,40,5],
["Mina de Prata","Veios promissores na montanha.",35,80,4],
["Torneio de Cavaleiros","Apostar no campeão da região.",45,100,1],
["Lavoura de Trigo","A colheita depende do clima.",12,25,2],
["Biblioteca dos Magos","Venda de pergaminhos raros.",20,50,3],
["Estalagem na Estrada","Renda estável de viajantes.",6,18,2],
["Mina Abandonada","Dizem que ainda há ouro lá.",60,150,3],
["Pesca de Alto-mar","Mar bravo, peixe farto.",28,55,2],
["Muralha da Cidade","Obra pública, paga bem no fim.",5,45,6],
["Criadouro de Dragões","Filhotes valem uma fortuna.",55,170,6],
["Mercado Negro","Contrabando arriscado.",50,120,1],
["Catedral Nova","Doações rendem com o tempo.",4,35,7],
["Rota da Seda","Parceria comercial duradoura.",15,70,8],
["Alquimista Maluco","A poção da riqueza, talvez.",65,200,2],
["Moinho do Vale","Moagem constante o ano todo.",9,28,4],
["Tesouro do Pirata","Mapa duvidoso, prêmio enorme.",75,400,3,1],
["Coroa Perdida","Relíquia lendária de um rei antigo.",80,500,5,1]];
const K=[
{n:"Banco Real",r:.03,max:300,t:"Juros baixos, limite menor."},
{n:"Guilda dos Mercadores",r:.08,max:200,t:"Juros médios."},
{n:"Agiota da Esquina",r:.18,max:500,t:"Empresta fácil, cobra caro."}];
const E=[
{n:"Festival da Colheita",t:"Menos risco e mais lucro nos novos investimentos.",r:-5,p:1.2,d:0,l:3},
{n:"Crise Econômica",t:"Mais risco, menos lucro e juros maiores.",r:10,p:.8,d:.03,l:3},
{n:"Guerra",t:"Caminhos perigosos: risco muito maior.",r:15,p:1.3,d:.02,l:3},
{n:"Peste",t:"Comércio parado: mais risco, menos lucro.",r:10,p:.7,d:0,l:3},
{n:"Inflação",t:"Os juros das dívidas sobem.",r:0,p:1,d:.05,l:3},
{n:"Assalto!",g:[-80,-30]},
{n:"Rei Generoso",g:[50,120]},
{n:"Descoberta de Ouro",g:[40,100]}];
const GOAL=5000,LIMIT=-500,LIVING=10,COOL=8;
const SHOPS=[
{id:"armas",i:"⚔️",n:"Loja de Armas",t:"Espadas, arcos e lanças para guardas e aventureiros."},
{id:"comida",i:"🍞",n:"Loja de Comida",t:"Pães, queijos e carnes para a cidade inteira."},
{id:"roupas",i:"🧵",n:"Loja de Roupas",t:"Capas, vestidos e tecidos finos."},
{id:"armadura",i:"🛡️",n:"Loja de Armaduras",t:"Escudos e armaduras forjados sob medida."},
{id:"magia",i:"🔮",n:"Loja de Itens Mágicos",t:"Poções, amuletos e pergaminhos misteriosos."}];
const $=id=>document.getElementById(id);
const f=n=>Math.round(n).toLocaleString("pt-BR");
const rnd=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
let S,tab="inv";

function start(n){slot=n;view="game";S={gold:300,turn:1,act:[],debts:[],offers:[],cd:{},ev:null,log:[],over:null,shop:null,stock:{},unl:{},vault:0,cap:15,orders:[],noise:1,inc:0,sold:0};fill();log("Bem-vindo! Construa o maior patrimônio que puder, sem deixar o ouro cair a "+f(LIMIT)+". Primeiro, escolha sua loja na aba Cidade.");tab="city";render()}
function log(m){S.log.unshift("Turno "+S.turn+": "+m);S.log=S.log.slice(0,14)}
function net(){return S.gold+(S.vault||0)+stv()+S.act.reduce((s,a)=>s+a.amt,0)-S.debts.reduce((s,d)=>s+d.amt,0)}
function fill(){
 S.offers=S.offers.filter(o=>o.exp>S.turn);
 while(S.offers.length<5){
  const used=S.offers.map(o=>o.i);
  const pool=C.map((c,i)=>i).filter(i=>!used.includes(i)&&(S.cd[i]||0)<=S.turn&&(!C[i][5]||Math.random()<.1));
  if(!pool.length)break;
  S.offers.push({i:pool[rnd(0,pool.length-1)],exp:S.turn+rnd(2,3)});
 }
}
function eRisk(c){return Math.min(95,Math.max(1,c[2]+(S.ev&&S.ev.r||0)))}
function eProf(c){return Math.round(c[3]*(S.ev&&S.ev.p||1))}

function invest(){
 const n=+$("n").value,v=Math.floor(+$("v").value),o=S.offers[n-1];
 if(!o)return log("Número inválido. Digite o número de uma oferta da lista."),render();
 if(!(v>0))return log("Digite um valor de ouro maior que zero."),render();
 if(v>S.gold)return log("Você não tem tanto ouro livre."),render();
 const c=C[o.i];
 S.gold-=v;S.act.push({name:c[0],amt:v,risk:eRisk(c),profit:eProf(c),left:c[4],dur:c[4]});
 S.cd[o.i]=S.turn+COOL;S.offers.splice(n-1,1);
 log("Investiu "+f(v)+" em "+c[0]+".");fill();render();
}
function withdraw(i){
 const a=S.act[i];if(!a||a.dur<4)return;
 const back=Math.round(a.amt*.8);S.gold+=back;S.act.splice(i,1);
 log("Resgate antecipado de "+a.name+": recebeu "+f(back)+" (multa de 20%).");check();render();
}
function borrow(){
 const k=+$("k").value-1,v=Math.floor(+$("lv").value);
 if(!K[k])return log("Escolha um credor de 1 a "+K.length+"."),render();
 if(!(v>0))return log("Digite quanto quer pedir emprestado."),render();
 let d=S.debts.find(x=>x.k===k);
 const owed=d?d.amt:0;
 if(owed+v>K[k].max)return log(K[k].n+" só empresta até "+f(K[k].max)+" no total. Você já deve "+f(owed)+"."),render();
 if(d)d.amt+=v;else S.debts.push({k,amt:v,age:0});
 S.gold+=v;log("Pegou "+f(v)+" emprestado com "+K[k].n+".");render();
}
function pay(i,all){
 const d=S.debts[i];if(!d)return;
 let v=all?d.amt:Math.floor(+$("p"+i).value);
 v=Math.min(v,d.amt,Math.max(0,S.gold));
 if(!(v>0))return log("Você precisa de ouro livre e de um valor maior que zero para pagar."),render();
 S.gold-=v;d.amt-=v;
 log("Pagou "+f(v)+" a "+K[d.k].n+".");
 if(d.amt<=0)S.debts.splice(i,1);
 render();
}
function event(){
 const e=E[rnd(0,E.length-1)];
 if(e.g){let g=rnd(e.g[0],e.g[1]);if(g<0)g=-Math.min(-g,Math.max(0,S.gold));S.gold+=g;log((g>0?"🎉 ":"🗡️ ")+e.n+" "+(g>0?"+":"")+f(g)+" de ouro.")}
 else{S.ev={...e,left:e.l};log("⚠️ Evento: "+e.n)}
}
function check(){
 if(S.gold<=LIMIT)S.over="lose";

let selShop=null,cfm=false;
function pickShop(i){if(S.shop)return;selShop=i;cfm=false;render()}

function vMap(){
 const has=!!S.shop;
 const hs=SHOPS.map((sh,i)=>{
  const g=HOT[sh.id],mine=has&&S.shop.id===sh.id,lock=has&&!mine,sel=!has&&selShop===i;
  const nome=sh.n.replace("Loja de ","");
  return `<button class="ch ${mine?"mine":""}${lock?" lock":""}${sel?" sel":""}" style="left:${g[0]}%;top:${g[1]}%;width:${g[2]}%;height:${g[3]}%" ${lock?"disabled":""} onclick="pickShop(${i})" aria-label="${sh.n}${lock?" (fechada)":""}"><span class="cp">${lock?"🔒 ":mine?"⭐ ":""}${nome}</span></button>`}).join("");
 const ev=S.ev?S.ev.n:"Tempos de paz";
 return `<div class="cmap" style="background-image:url(${CIDADE_IMG})"><div class="ctit">${ev}</div>${hs}</div>`+
  `<div class="tag">${has?"Sua loja está destacada no mapa. As outras estão trancadas.":"Toque em uma loja no mapa para ver os detalhes."}</div>`;
}
function shopInfo(id){

 if(m.paz<1)dn.unshift("Tempos de paz");

 const ps=PL(id).map(k=>PR[k]);
 return {prod:ps.length>1?ps[0].i+" "+ps[0].n+" (+"+(ps.length-1)+" para abrir depois)":ps[0].i+" "+ps[0].n,up:up.join(", ")||"—",dn:dn.join(", ")||"—",tax:mn+"% a "+mx+"%"};

function pickCard(){
 if(S.shop)return "";
 if(selShop===null)return `<div class="card pick empty"><b>Qual loja você herdou?</b><div class="tag">Cada loja vende um produto diferente e reage de um jeito às crises da cidade. Escolha com calma: a decisão é definitiva.</div></div>`;
 const sh=SHOPS[selShop],inf=shopInfo(sh.id);

 <div class="cl-grid"><div><small>Vende</small><b>${inf.prod}</b></div><div><small>Começa com</small><b>12 unidades</b></div><div><small>📈 Valoriza em</small><b>${inf.up}</b></div><div><small>📉 Cai em</small><b>${inf.dn}</b></div><div style="grid-column:1/-1"><small>🏛️ Imposto de renda</small><b>${inf.tax} conforme a época</b></div></div>
 ${cfm?`<div class="pk-warn">Tem certeza? Você só terá esta loja nesta partida.</div><div class="form"><button class="go" onclick="chooseShop(${selShop})">Sim, abrir ${sh.n}</button><button class="alt" onclick="noShop()">Voltar</button></div>`:`<div class="form"><button class="go pk-btn" onclick="askShop()">Escolher esta loja</button></div>`}</div>`;
}
const BASE=10,TXN=5,BAL=10;
function adjustBar(){return `<div class="card form" style="margin:10px 0"><b>Ouro da loja</b><input id="aj" type="number" min="1" inputmode="numeric" placeholder="valor"><button class="go" onclick="ajustar(1)">Adicionar</button><button class="alt" onclick="ajustar(0)">Remover</button><span style="width:100%"></span><button class="alt" style="color:var(--good)" onclick="ajustar(1,10)">+10</button><button class="alt" style="color:var(--good)" onclick="ajustar(1,50)">+50</button><button class="alt" style="color:var(--good)" onclick="ajustar(1,100)">+100</button><button class="alt" style="color:var(--bad)" onclick="ajustar(0,10)">−10</button><button class="alt" style="color:var(--bad)" onclick="ajustar(0,50)">−50</button><button class="alt" style="color:var(--bad)" onclick="ajustar(0,100)">−100</button></div>`}
function ajustar(add,q){const v=q||Math.floor(+$("aj").value);if(!(v>0))return log("Digite um valor de ouro maior que zero."),render();S.gold+=add?v:-v;log("Ajuste manual: "+(add?"adicionou ":"removeu ")+f(v)+" de ouro.");check();render()}
function vRpg(){return `<h2>RPG</h2><div class="tag">Use esta aba para sincronizar o ouro da loja com o ouro do personagem na aventura: adicione o que o jogador colocou na loja e remova o que ele tirou.</div>`+adjustBar()+`<div class="tag">Esses ajustes não contam como renda e não pagam imposto.</div>`}
function capCard(){const nx=S.cap<25?[25,100]:S.cap<50?[50,200]:null;return `<div class="card"><div class="row"><b>Capacidade do estoque</b><span class="tag">${S.cap} unidades por item</span></div>${nx?`<div class="form"><button class="go" onclick="upCap()">Ampliar para ${nx[0]} (${nx[1]} de ouro)</button></div>`:'<div class="tag">Capacidade máxima atingida.</div>'}</div>`}
function upCap(){const nx=S.cap<25?[25,100]:S.cap<50?[50,200]:null;if(!nx)return;if(S.gold<nx[1])return log("Você precisa de "+nx[1]+" de ouro livre para ampliar o estoque."),render();S.gold-=nx[1];S.cap=nx[0];log("Estoque ampliado: agora cabem "+nx[0]+" unidades de cada item (custou "+nx[1]+" de ouro).");render()}
const PL=s=>Object.keys(PR).filter(k=>k===s||PR[k].shop===s);
const cst=k=>PR[k].c||BASE,bs=k=>PR[k].b||BASE;
function stv(){return Object.keys(S.stock).reduce((s,k)=>s+S.stock[k]*cst(k),0)}
function pp(k){const m=PR[k].m,e=S.ev&&EK[S.ev.n];return Math.max(1,Math.round(bs(k)*(e&&m[e]!==undefined?m[e]:m.paz)*S.noise))}

function vaultCard(){return `<h2>Cofre</h2><div class="card"><div class="row"><b>Ouro guardado: ${f(S.vault)}</b><span class="tag">Protegido de assaltos</span></div><div class="form"><input id="vd" type="number" min="1" inputmode="numeric" placeholder="valor"><button class="go" onclick="depositar()">Depositar</button><button class="alt" onclick="sacar()">Sacar</button></div></div>`}
function depositar(){const v=Math.floor(+$("vd").value);if(!(v>0))return log("Digite quanto quer depositar."),render();if(v>S.gold)return log("Você só tem "+f(Math.max(0,S.gold))+" de ouro livre para depositar."),render();S.gold-=v;S.vault+=v;log("Depositou "+f(v)+" no cofre.");render()}
function sacar(){const v=Math.floor(+$("vd").value);if(!(v>0))return log("Digite quanto quer sacar."),render();if(v>S.vault)return log("O cofre só tem "+f(S.vault)+" de ouro."),render();S.vault-=v;S.gold+=v;log("Sacou "+f(v)+" do cofre.");render()}

function mkProd(k){const p=PR[k],q=Math.floor(+$("bq_"+k).value);if(!(q>0))return log("Digite quantas unidades quer produzir."),render();if((S.stock[k]||0)+q>S.cap)return log("Estoque cheio: cabem "+S.cap+" unidades de "+p.n+" e você tem "+(S.stock[k]||0)+"."),render();const c=q*cst(k);if(c>S.gold)return log("Faltam "+f(c-S.gold)+" de ouro para produzir "+q+" unidades."),render();S.gold-=c;S.stock[k]=(S.stock[k]||0)+q;log(p.w+" "+q+" unidades de "+p.n+" por "+f(c)+" de ouro.");render()}
function sellProd(k){const p=PR[k],q=Math.floor(+$("sq_"+k).value),pr=pp(k),have=S.stock[k]||0;if(!(q>0))return log("Digite a quantidade que quer vender."),render();if(q>have)return log("Você só tem "+have+" unidades de "+p.n+" no estoque."),render();if(S.sold+q>BAL)return log("Limite do balcão: você ainda pode vender "+(BAL-S.sold)+" unidades neste turno."),render();S.sold+=q;S.stock[k]=have-q;S.gold+=q*pr;S.inc+=q*pr;log("Vendeu "+q+" "+p.n+" no balcão por "+f(q*pr)+" de ouro.");check();render()}
function acc(i){const o=S.orders[i];if(!o)return;const k=o.pid||S.shop.id,have=S.stock[k]||0;if(have<o.q)return log("Estoque insuficiente: faltam "+(o.q-have)+" unidades."),render();S.stock[k]=have-o.q;S.orders.splice(i,1);if(Math.random()*100<o.r){S.gold+=o.q*o.p;S.inc+=o.q*o.p;log("Entregou "+o.q+" "+PR[k].n+" para "+o.who+" e recebeu "+f(o.q*o.p)+" de ouro.")}else log("⚠️ "+o.who+" não pagou! Você perdeu "+o.q+" unidades de "+PR[k].n+".");check();render()}
function potCard(k){
  const p=PR[k];

  return `<div class="card"><div class="row"><b>${p.i} ${p.n}</b><span class="tag">${st}</span></div><div class="stats"><span>Estoque: ${S.stock[k]||0}/${S.cap}</span><span>Custo: ${cst(k)}</span><span>Preço hoje: ${pr}</span></div><div class="tag">${trend}. ${p.t}</div><div class="form"><label>Qtd <input id="bq_${k}" type="number" min="1" inputmode="numeric"></label><button class="go" onclick="mkProd('${k}')">${p.v} (${cst(k)} de ouro cada)</button></div><div class="form"><label>Qtd <input id="sq_${k}" type="number" min="1" inputmode="numeric"></label><button class="alt" ${S.sold>=BAL?"disabled":""} onclick="sellProd('${k}')">Vender no balcão (${pr} cada)</button></div></div>`;
}

let selP="magia";
function pickP(k){selP=k;render()}
function vMagia(){
  const ks=PL("magia");if(ks.indexOf(selP)<0)selP=ks[0];
  const hs=ks.map((k,i)=>{const un=!!S.unl[k],n=S.stock[k]||0;
    return `<button class="hot h${i+1}${selP===k?" sel":""}${un?"":" off"}" onclick="pickP('${k}')" aria-label="${PR[k].n}${un?"":" (fechada)"}"><span class="bd">${un?n+"/"+S.cap:"🔒"}</span></button>`}).join("");
  return '<h2>'+S.shop.i+' '+S.shop.n+'</h2><div class="tag">Vendas no balcão: restam '+(BAL-S.sold)+' de '+BAL+' neste turno (somando todos os produtos). Toque em uma poção da prateleira.</div>'+capCard()+
   `<div class="magia" style="background-image:url(${MAGIA_IMG})">${hs}</div>`+potCard(selP);
}
function vProd(){
 if(!S.shop)return '<h2>Estoque</h2><div class="card tag">Escolha sua loja na aba Cidade primeiro.</div>';
 if(S.shop.id==="magia")return vMagia();
 let h='<h2>'+S.shop.i+' '+S.shop.n+'</h2><div class="tag">Vendas no balcão: restam '+(BAL-S.sold)+' de '+BAL+' neste turno (somando todos os produtos).</div>'+capCard();
 PL(S.shop.id).forEach(k=>{h+=potCard(k)});
 return h;
}
function vCli(){
 if(!S.shop)return '<h2>Clientes</h2><div class="card tag">Escolha sua loja na aba Cidade primeiro.</div>';
 let h="<h2>Clientes</h2>"+PL(S.shop.id).filter(k=>S.unl[k]).map(k=>`<div class="card row"><span>${PR[k].i} <b>${PR[k].n}</b> em estoque</span><b>${S.stock[k]||0} un.</b></div>`).join("");
 if(!S.orders.length)h+='<div class="card tag">Nenhum cliente por enquanto. Novos aparecem a cada turno.</div>';
 S.orders.forEach((o,i)=>{
  const k=o.pid||S.shop.id,p=PR[k],have=S.stock[k]||0,can=have>=o.q,c=CL.find(x=>x.n===o.who)||{};

const CL=[{n:"Capitão da Guarda",r:100,img:FOTO_CAPITAO,fr:{"*":["Minha função é garantir que todos durmam em segurança.", "Uma cidade segura não se constrói apenas com espadas, mas com pessoas de confiança.", "Temos poucos homens para patrulhar toda a região. Qualquer ajuda é bem-vinda.", "As muralhas protegem nossos corpos, mas é a união que protege nosso lar.", "Enquanto eu estiver de serviço, nenhum criminoso ficará impune!"],magia:["Sempre protegendo a cidade.","Estamos precisando de poções de cura.","Eaê, cara! Me vê uma poção de força.","Preciso ajudar as plantas a crescerem.","Sempre a postos pela cidade!","Precisamos reforçar nosso estoque de poções. Nunca se sabe quando haverá uma emergência.", "Uma poção de cura pode salvar mais vidas do que uma espada bem afiada.", "Tem algo que aumente a resistência? Meus guardas estão exaustos.", "Se tiver algum item capaz de detectar venenos, a guarda tem interesse.", "Anote na conta da guarda… Brincadeira! O tesouro municipal está apertado."]}},{n:"Embaixador do Norte",r:98},{n:"Mestre de Obras",r:95},{n:"Dona Marta",r:92,img:FOTO_MARTA,fr:{"*":["Bom dia, meu filho! Que os deuses abençoem seu caminho.", "Ai, minhas costas… trabalhar na roça já não é fácil nessa idade!", "Você viu como minhas plantinhas estão crescendo? Hihi!", "Tenho uns legumes fresquinhos pra vender, quer dar uma olhadinha?", "Cuidado na estrada, viu? Tem muita coisa estranha acontecendo por aí!", "Ah, meu falecido marido adorava essa época do ano…", "Se encontrar meus netinhos por aí, diga que a vovó está com saudades!", "Esses jovens de hoje têm tanta pressa… aproveitem a vida, meus queridos!", "Que Nossa Senhora… quer dizer, que os deuses protejam nossa vilazinha!", "Volte sempre, viu? Uma visita faz bem pro coração de uma velha como eu!"]}},{n:"Chefe da Aldeia",r:90},{n:"Barão Ricardo",r:88},{n:"Mercador do Porto",r:85},{n:"Viajante Misterioso",r:80}];
function price(){const m=PR[S.shop.id].m,k=S.ev&&EK[S.ev.n];return Math.max(1,Math.round(BASE*(k&&m[k]!==undefined?m[k]:m.paz)*S.noise))}
function fraseCli(c,sid){const a=((c.fr&&c.fr[sid])||[]).concat((c.fr&&c.fr["*"])||[]);return a.length?a[rnd(0,a.length-1)]:""}
function genOrders(){for(let k=rnd(1,3);k>0;k--){const f=.8+Math.random()*.4;const c=CL[rnd(0,CL.length-1)],ul=PL(S.shop.id).filter(x=>S.unl[x]),pid=ul[rnd(0,ul.length-1)];S.orders.push({who:c.n,fr:fraseCli(c,S.shop.id),r:c.r,q:rnd(6,20),pid:pid,p:Math.max(1,Math.round(pp(pid)*f)),exp:S.turn+2})}}
function buyStock(){const q=Math.floor(+$("bq").value);if(!(q>0))return log("Digite quantas unidades quer produzir."),render();const c=q*BASE;if(c>S.gold)return log("Faltam "+f(c-S.gold)+" de ouro para produzir "+q+" unidades."),render();S.gold-=c;S.stock+=q;log(PR[S.shop.id].w+" "+q+" unidades por "+f(c)+" de ouro.");render()}
function sellBar(){const q=Math.floor(+$("sq").value),p=price();if(!(q>0))return log("Digite a quantidade que quer vender."),render();if(q>S.stock)return log("Você só tem "+S.stock+" unidades no estoque."),render();if(S.sold+q>BAL)return log("Limite do balcão: você ainda pode vender "+(BAL-S.sold)+" unidades neste turno."),render();S.sold+=q;S.stock-=q;S.gold+=q*p;S.inc+=q*p;log("Vendeu "+q+" no balcão por "+f(q*p)+" de ouro.");check();render()}
function acceptOrder(i){const o=S.orders[i];if(!o)return;if(S.stock<o.q)return log("Estoque insuficiente: faltam "+(o.q-S.stock)+" unidades."),render();S.stock-=o.q;S.orders.splice(i,1);if(Math.random()*100<o.r){S.gold+=o.q*o.p;S.inc+=o.q*o.p;log("Entregou "+o.q+" para "+o.who+" e recebeu "+f(o.q*o.p)+" de ouro.")}else log("⚠️ "+o.who+" não pagou! Você perdeu "+o.q+" unidades.");check();render()}
function refuseOrder(i){const o=S.orders[i];if(!o)return;log("Recusou a encomenda de "+o.who+".");S.orders.splice(i,1);render()}
function vStock(){
 if(!S.shop)return '<h2>Loja</h2><div class="card tag">Escolha sua loja na aba Cidade primeiro.</div>';
 const p=PR[S.shop.id],pr=price(),m=pr-BASE,st=S.ev?S.ev.n:"Tempos de paz";
 const trend=pr>=BASE*1.15?"📈 Em alta":pr<BASE?"📉 Em baixa":"➖ Estável";
 let h=`<h2>${S.shop.i} ${S.shop.n}</h2><div class="card"><div class="row"><b>${p.i} ${p.n}</b><span class="tag">${st}</span></div>
 <div class="stats"><span>Estoque: ${S.stock}</span><span>Custo: ${BASE}</span><span>Preço hoje: ${pr}</span></div>
 <div class="tag">${trend}. ${p.t}</div>
 <div class="form"><label>Qtd <input id="bq" type="number" min="1" inputmode="numeric"></label><button class="go" onclick="buyStock()">${p.v} (${BASE} de ouro cada)</button></div>
 <div class="form"><label>Qtd <input id="sq" type="number" min="1" inputmode="numeric"></label><button class="alt" ${S.sold>=BAL?"disabled":""} onclick="sellBar()">Vender no balcão (${pr} cada)</button><span class="tag">Restam ${BAL-S.sold} de ${BAL} vendas neste turno</span></div></div>`;
 return h;
}
function vOrders(){
 if(!S.shop)return '<h2>Clientes</h2><div class="card tag">Escolha sua loja na aba Cidade primeiro.</div>';
 const pr=price();
 const p=PR[S.shop.id];let h=`<h2>Clientes</h2><div class="card row"><span>${p.i} <b>${p.n}</b> em estoque</span><b>${S.stock} un.</b></div>`;
 if(!S.orders.length)h+='<div class="card tag">Nenhum cliente por enquanto. Novos aparecem a cada turno.</div>';
 S.orders.forEach((o,i)=>{
  const d=Math.round((o.p/pr-1)*100),lucro=o.q*(o.p-BASE),can=S.stock>=o.q;
  h+=`<div class="card"><div class="row"><b>${o.who}</b><span class="tag">espera por mais ${o.exp-S.turn} turno(s)</span></div>
  <div class="stats"><span>Quer comprar: <b>${o.q} × ${p.i} ${p.n}</b></span><span>${o.p} de ouro cada</span><span class="pos">Pagamento: ${f(o.q*o.p)}</span></div>
  <div class="stats"><span>Confiabilidade: ${o.r}%</span></div>
  <div class="form"><button class="go" ${can?"":"disabled"} onclick="acceptOrder(${i})">Aceitar</button><button class="alt" onclick="refuseOrder(${i})">Recusar</button>${can?"":`<span class="tag">Faltam ${o.q-S.stock} unidades no estoque</span>`}</div></div>`;
 });
 return h;
}
function chooseShop(i){
 if(S.shop)return;
 cfm=false;S.shop=SHOPS[i];S.stock={[S.shop.id]:12};S.unl={[S.shop.id]:1};genOrders();log("Você recebeu 12 unidades de "+PR[S.shop.id].n+" no estoque.");log("Você ficou com a "+S.shop.n+". É nela que você vai começar a aprender.");render();
}
function vCity(){
 const has=!!S.shop;
 let h="<h2>"+(has?"Sua cidade":"Escolha sua loja")+"</h2><div class='tag'>"+(has?"Você herdou a "+S.shop.n+". As outras lojas estão fechadas por enquanto.":"Você herdou uma loja na cidadezinha. Escolha uma para começar: é nela que você vai aprender o ofício.")+"</div><div class='banner'><b>Estado da cidade: "+(S.ev?S.ev.n:"Tempos de paz")+"</b>"+(S.ev?" ("+S.ev.left+" turno(s) restantes). "+S.ev.t:". Tudo calmo por enquanto.")+"</div>"+vMap()+pickCard();
 if(has)h+=`<div class="card pick mineCard"><div class="pk-head"><span class="pk-ico">${S.shop.i}</span><div><b class="pk-nome">${S.shop.n}</b><div class="tag">${S.shop.t}</div></div></div><div class="pos"><b>⭐ Sua loja</b></div></div>`;
 return h+"<div class='card tag'>🔒 Os investimentos estão bloqueados por enquanto.</div>";
}
function pass(){
 if(!S.shop){log("Escolha uma loja na aba Cidade antes de passar o turno.");return render()}
 if(S.over)return;
 S.turn++;S.sold=0;S.gold-=LIVING;
 S.act=S.act.filter(a=>{
  a.left--;if(a.left>0)return true;
  if(Math.random()*100<a.risk)log("💀 "+a.name+" deu errado: perdeu "+f(a.amt)+".");
  else{const g=Math.round(a.amt*(1+a.profit/100));S.gold+=g;S.inc+=g-a.amt;log("✅ "+a.name+" rendeu "+f(g)+" (lucro de "+f(g-a.amt)+").")}
  return false;
 });
 S.debts.forEach(d=>{
  d.amt=Math.round(d.amt*(1+K[d.k].r+(S.ev?S.ev.d:0)));d.age++;
  if(d.age>6){const c=Math.round(d.amt*.1);S.gold-=c;log("👊 Cobradores de "+K[d.k].n+" levaram "+f(c)+" de ouro.")}
 });
 if(S.ev){S.ev.left--;if(S.ev.left<=0){log("O evento "+S.ev.n+" terminou.");S.ev=null}}
 if(!S.ev&&Math.random()<.4)event();
 if(S.turn%TXN===0)collectTax();
 S.noise=.92+Math.random()*.16;S.orders=S.orders.filter(o=>o.exp>S.turn);genOrders();
 S.offers.forEach(o=>{if(o.exp<=S.turn)S.cd[o.i]=S.turn+COOL});
 fill();check();render();
}

function vInv(){
 let h=(S.shop?`<div class="card row"><span>${S.shop.i} <b>${S.shop.n}</b></span><span class="tag">Onde você começa a aprender</span></div>`:"")+(S.shop?`${invStock()}${vaultCard()}`:"")+taxCard()+"<h2>Investimentos ativos</h2>";
 if(!S.act.length)h+='<div class="card tag">Nada investido. Abra a aba Investir e escolha uma oferta.</div>';
 S.act.forEach((a,i)=>{
  h+=`<div class="card"><div class="row"><b>${a.name}</b><span class="tag">${a.left} turno(s) restante(s)${a.dur>=4?" · longo prazo":""}</span></div>
  <div class="stats"><span>Aplicado: ${f(a.amt)}</span><span class="pos">Retorno: +${a.profit}%</span><span class="neg">Risco: ${a.risk}%</span></div>
  ${a.dur>=4?`<div class="form"><button class="alt" onclick="withdraw(${i})">Resgatar agora (multa de 20%)</button></div>`:""}</div>`;
 });
 h+="<h2>Dívidas</h2>";
 h+=S.debts.length?S.debts.map(d=>`<div class="card row"><span>${K[d.k].n}</span><b class="neg">${f(d.amt)}</b></div>`).join(""):'<div class="card tag">Você não deve nada.</div>';
 h+="<h2>Histórico</h2><ul class='log'>"+S.log.map(l=>"<li>"+l+"</li>").join("")+"</ul>";
 return h;
}
function vMkt(){
 return '<h2>🔒 Investimentos bloqueados</h2><div class="card tag">Esta parte será liberada em breve, conforme a cidade for desbloqueada.</div>';
 let h='<h2>Ofertas do dia</h2><div class="tag">As ofertas expiram e só voltam depois de vários turnos.</div>';
 S.offers.forEach((o,i)=>{
  const c=C[o.i],long=c[4]>=4;
  h+=`<div class="card"><div class="row"><span><span class="num">${i+1}</span><b>${c[0]}</b>${c[5]?" ✨ Rara":""}</span><span class="tag">expira em ${o.exp-S.turn} turno(s)</span></div>
  <div class="tag">${c[1]}</div>
  <div class="stats"><span class="neg">Risco: ${eRisk(c)}%</span><span class="pos">Lucro: +${eProf(c)}%</span><span>Prazo: ${c[4]} turno(s)${long?" · longo prazo":""}</span></div></div>`;
 });
 h+=`<div class="card"><b>Investir</b><div class="form"><label>Nº da oferta <input id="n" type="number" min="1" max="${S.offers.length}" inputmode="numeric"></label><label>Ouro <input id="v" type="number" min="1" inputmode="numeric"></label><button class="go" onclick="invest()">Investir</button></div>
 <div class="tag">Ouro livre: ${f(S.gold)}. Investimentos de longo prazo (4+ turnos) rendem mais e podem ser resgatados antes, com multa.</div></div>`;
 return h;
}
function vDebt(){
 let h="<h2>Credores</h2>";
 K.forEach((k,i)=>h+=`<div class="card"><div class="row"><span><span class="num">${i+1}</span><b>${k.n}</b></span><span class="tag">limite ${f(k.max)}</span></div><div class="tag">${k.t}</div><div class="stats"><span class="neg">Juros: ${(k.r*100).toFixed(0)}% por turno</span></div></div>`);
 h+=`<div class="card"><b>Pedir empréstimo</b><div class="form"><label>Nº do credor <input id="k" type="number" min="1" max="3" inputmode="numeric"></label><label>Valor <input id="lv" type="number" min="1" inputmode="numeric"></label><button class="go" onclick="borrow()">Pegar ouro</button></div></div>`;
 h+="<h2>Suas dívidas</h2>";
 if(!S.debts.length)h+='<div class="card tag">Sem dívidas.</div>';
 S.debts.forEach((d,i)=>h+=`<div class="card"><div class="row"><b>${K[d.k].n}</b><b class="neg">${f(d.amt)}</b></div>
  <div class="tag">${d.age>6?"⚠️ Atrasada: cobradores levam 10% por turno.":"Há "+d.age+" turno(s). Depois de 6, os cobradores aparecem."}</div>
  <div class="form"><input id="p${i}" type="number" min="1" inputmode="numeric" placeholder="valor"><button class="go" onclick="pay(${i})">Pagar</button><button class="alt" onclick="pay(${i},1)">Quitar tudo</button></div></div>`);
 return h;
}
function vFaq(){
 const q=[["O que é risco?","É a chance de perder todo o ouro daquele investimento. Risco de 30% significa 3 chances em 10 de dar errado."],
 ["O que é lucro?","É quanto você ganha a mais se der certo. Aplicar 100 com lucro de 50% devolve 150."],
 ["O que são juros?","É o preço de usar o dinheiro dos outros. Nas dívidas, os juros são somados todo turno, então a dívida cresce sozinha."],
 ["O que é liquidez?","É a facilidade de transformar um investimento em ouro. O longo prazo tem pouca liquidez: resgatar antes custa 20%."],
 ["O que é diversificar?","Dividir o ouro em vários investimentos, para que um fracasso não derrube tudo."],
 ["Como eu perco?","Se o ouro livre chegar a "+f(LIMIT)+". A cada turno você gasta "+LIVING+" de ouro com despesas, e os cobradores levam ouro de dívidas atrasadas."],
 ["Como eu ganho?","Não há meta final: o jogo continua enquanto você aguentar. O objetivo é fazer o patrimônio (ouro + investimentos – dívidas) crescer o máximo possível sem deixar o ouro livre chegar a "+f(LIMIT)+", porque aí você perde."],
 ["Preços da loja","Seu produto custa 10 de ouro. O preço de venda muda com a cidade: na paz, espadas e elmos vendem abaixo do custo (prejuízo), e na guerra disparam. Festivais favorecem comida e roupas, e a peste favorece poções. Guarde estoque para esperar a alta."],["Imposto de renda","A cada 5 turnos a coroa cobra imposto sobre a renda do período (vendas e rendimentos). A alíquota normal é 10%, mas depende da sua loja e da época: quando o seu produto está em alta a alíquota sobe (até 15%), e quando está em baixa ela cai (até 5%). Por exemplo, a loja de pães paga 15% no festival e 6% na guerra, e a de espadas paga o contrário."],["Cofre","Guarde ouro no cofre (aba Inventário) para ficar a salvo de assaltos. O ouro do cofre conta no patrimônio, mas não conta como ouro livre, e é o ouro livre que decide se você perde ao chegar a -500."],["Dicas","Não coloque tudo em uma oferta só. Pague o agiota primeiro. Ofertas raras pagam muito, mas quase sempre dão errado. Eventos mudam risco e lucro, então vale esperar uma crise passar."]];
 return "<h2>Dúvidas</h2>"+q.map(x=>`<details><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join("");
}
function render(){
 if(view!=="game")return vMenu();
 const g=S.gold,left=g-LIMIT;
 let h=`<div class="row"><h1>Rei do Ouro</h1><button class="alt" onclick="menu()">Menu (jogo salvo)</button></div><div class="top"><div><small>Turno</small><b>${S.turn}</b></div><div><small>Ouro livre</small><b class="${g<0?"neg":""}">${f(g)}</b></div><div><small>Patrimônio</small><b>${f(net())}</b></div></div>`;
 if(!storeOk)h+='<div class="banner neg">Não foi possível salvar neste navegador. O progresso será perdido ao sair.</div>';
 if(S.ev)h+=`<div class="banner"><b>${S.ev.n}</b> (${S.ev.left} turno(s)): ${S.ev.t}</div>`;
 if(g<0&&!S.over)h+=`<div class="banner neg"><b>Perigo!</b> Faltam ${f(left)} de ouro para perder o jogo.</div>`;
 if(S.log[0])h+=`<div class="tag" style="margin-top:8px">Último aviso: ${S.log[0]}</div>`;
 const T=[["city","Cidade"],["orders","Clientes"+(S.orders.length?" ("+S.orders.length+")":"")],["stock","Estoque"],["inv","Inventário"],["mkt","🔒 Investir"],["debt","Dívidas"],["faq","Dúvidas"],["rpg","RPG"]];
 h+='<div class="tabs">'+T.map(t=>`<button class="${tab===t[0]?"on":""}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join("")+"</div>";
 h+={city:vCity,orders:vCli,stock:vProd,inv:vInv,mkt:vMkt,debt:vDebt,faq:vFaq,rpg:vRpg}[tab]();
 h+=`<button class="go turn" onclick="pass()">Passar turno (despesas: ${LIVING} de ouro)</button>`;
 if(S.over)h+=`<div class="over"><div><h1>${S.over==="win"?"Você venceu!":"Você faliu!"}</h1><p>${S.over==="win"?"Seu patrimônio chegou a "+f(net())+" em "+S.turn+" turnos.":"Seu ouro chegou a "+f(S.gold)+" no turno "+S.turn+"."}</p><button class="go" onclick="start(slot)">Jogar de novo</button></div></div>`;
 $("app").innerHTML=h;save();
}
const KEY="reiouro:slot:";
let slot=0,view="menu",mode="",ask="",storeOk=true;
function rd(n){try{const r=localStorage.getItem(KEY+n);return r?JSON.parse(r):null}catch(e){storeOk=false;return null}}
function save(){if(view!=="game"||!S||!slot)return;try{localStorage.setItem(KEY+slot,JSON.stringify({sum:{turn:S.turn,gold:S.gold,net:net(),shop:S.shop?S.shop.n:"",over:S.over},S}))}catch(e){storeOk=false}}
function menu(){view="menu";mode="";ask="";render()}
function pick(m){mode=m?"new":"load";ask="";render()}
function slotGo(n){if(mode==="new"){if(rd(n)&&ask!=="o"+n){ask="o"+n;return render()}start(n)}else{const d=rd(n);if(!d)return;S=d.S;fix();slot=n;view="game";tab="city";render()}}
function del(n){if(ask!=="d"+n){ask="d"+n;return render()}try{localStorage.removeItem(KEY+n)}catch(e){storeOk=false}ask="";render()}
function vMenu(){
 let h='<div class="menu"><h1>Rei do Ouro</h1><div class="tag">Simulador de investimentos</div>';
 if(!mode){
  const any=[1,2,3,4,5].some(n=>rd(n));
  h+='<button class="go" onclick="pick(1)">Começar</button><button class="alt" '+(any?"":"disabled ")+'onclick="pick(0)">Continuar</button>';
  h+='<div class="tag">Seu progresso é salvo automaticamente neste navegador, em 5 espaços.</div>';
 }else{
  h+="<h2>"+(mode==="new"?"Escolha um espaço para o novo jogo":"Escolha o jogo para continuar")+"</h2>";
  for(let n=1;n<=5;n++){
   const d=rd(n),s=d&&d.sum,can=mode==="new"||!!s;
   const info=s?"Turno "+s.turn+", "+(s.shop||"sem loja")+", ouro "+f(s.gold)+", patrimônio "+f(s.net)+(s.over?" (encerrado)":""):"Vazio";
   const lb=mode==="new"?(ask==="o"+n?"Confirmar?":s?"Sobrescrever":"Usar"):"Jogar";
   h+='<div class="card row"><div><b>Espaço '+n+'</b><div class="tag">'+info+'</div></div><div class="form" style="margin:0"><button class="go" '+(can?"":"disabled ")+'onclick="slotGo('+n+')">'+lb+'</button>'+(s?'<button class="alt" onclick="del('+n+')">'+(ask==="d"+n?"Confirmar?":"Apagar")+'</button>':"")+'</div></div>';
  }
  h+='<button class="alt" onclick="menu()">Voltar</button>';
 }
 if(!storeOk)h+='<div class="banner neg">Este navegador não permite salvar. O progresso não será guardado.</div>';
 $("app").innerHTML=h+"</div>";
}
menu();
</script>
